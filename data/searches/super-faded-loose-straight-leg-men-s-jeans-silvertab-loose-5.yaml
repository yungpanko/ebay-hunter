name: Super-faded loose straight-leg men's jeans (SilverTab Loose/569), 33–36 waist
idea: vintage jeans
summary: Men's vintage jeans with a looser fit and high rise, straight leg with no taper and a ~9-10"
  opening, in a super faded light wash. Benchmarked against the user's Sugar Cane 1947 (size 34) but roomier
  in the thigh; happy to size up in the waist and belt. Under $70, clean apart from small holes.
