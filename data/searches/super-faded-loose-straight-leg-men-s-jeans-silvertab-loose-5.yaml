fit_notes: 'Loose, high rise, straight leg, no taper. Benchmark: Sugar Cane 1947 size 34 (waist ~16.5\"
  flat, rise ~11.75\", thigh ~12.25\", opening ~9\") but roomier through the thigh. Bigger waist is fine;
  they''ll belt it.'
price_guidance: Max $70. 90s SilverTab Loose usually runs $45-70 on eBay/Etsy; 569s can be listed higher
  by resellers. Under ~$35 shipped is a steal; $45-60 is fair; above $70 is out.
knowledge:
- 'SilverTab Loose: silver (not red) back pocket tab; inner waistband label often printed ''LOOSE''. 90s
  versions have a straight, roomy leg and high rise. Best target.'
- 'Levi''s 569 Loose Straight: straight, generous seat/thigh, but sits lower than 550s, so verify the
  front rise is ~11.5"+.'
- Levi's 550 (relaxed) and 560 (loose) both taper toward the hem, so reject them unless the measured opening
  is ~9"+ and the leg reads straight in photos.
- 'Check the leg shape in photos: knee and hem should be similar widths. A narrowing hem means it''s tapered.'
- Prefer genuine wear fading (whiskers, honeycombs, faded seams/pockets) over acid wash or bleach splatter.
- Look closely for stains, crotch blowouts and knee rips in photos; small pinholes are acceptable.
- Tag sizes on vintage Levi's often run off by 1-2"; rely on measured flat waist.
gem_notes: Show badly titled or unbranded pairs (e.g. 'blue jeans 34' or 'old faded denim') if the photos
  show a light fade and a straight, roomy leg. Also show Lee, Wrangler or workwear jeans with the right
  shape, and sized-up 501s (35-36 waist) if the thigh and opening measure in range. A great Made in USA
  SilverTab slightly over budget on Best Offer is worth flagging.
