name: hunt

on:
  schedule:
    - cron: "17 */2 * * *"   # every 2 hours, at :17 (GitHub may start it a few minutes late)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Write emails to data/outbox instead of sending"
        type: boolean
        default: false

permissions:
  contents: write   # to commit seen items, reviews, feedback and the learned profile back

concurrency:
  group: hunt
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Hunt
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          HUNTER_EMAIL_TO: ${{ secrets.HUNTER_EMAIL_TO }}
          HUNTER_MODEL: ${{ vars.HUNTER_MODEL }}
        run: python -m hunter -v cron ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: Save state
        if: always()
        run: |
          git config user.name "ebay-hunter"
          git config user.email "ebay-hunter@users.noreply.github.com"
          git add data/searches data/state data/profile.md
          git diff --cached --quiet || git commit -m "hunt: update state [skip ci]"
          git pull --rebase && git push
